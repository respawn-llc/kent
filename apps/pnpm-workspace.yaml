packages:
  - "desktop"
  - "desktop/packages/*"
  - "shared/*"

# Use the installed pnpm when the manifest's reference version differs.
pmOnFail: warn

overrides:
  "@tanstack/history": "1.162.2"

# 7 days. Keeps freshly published packages out of local installs/updates.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Maintainer-approved exact versions required by this lockfile; remove Effect entries after 2026-10-08 03:11 UTC.
  - "@effect/atom-react@4.0.0"
  - "@effect/vitest@4.0.0"
  - "@napi-rs/wasm-runtime@1.2.2"
  - "effect@4.0.0"
  # Approved for the streaming render fix; remove after October 7, 2026.
  - "remend@1.4.0"
  - "streamdown@2.7.0"
  - "vite@8.2.0"

# No frontend dependency may run install/build lifecycle scripts unless explicitly reviewed here.
onlyBuiltDependencies: []

# PNPM 11 requires an explicit decision for ignored lifecycle scripts.
allowBuilds:
  msgpackr-extract: false
  msw: false
  # The resolver ships platform bindings as optional dependencies. Its postinstall
  # fallback is unnecessary for the supported workspace toolchains.
  unrs-resolver: false
