syntax = "proto3";

package kent.api.configuration;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "kent/api/auth/auth.proto";
import "kent/api/shared/validation.proto";

option go_package = "core/shared/protoapi/gen/kent/api/configuration;configurationpb";

enum ModelVerbosity {
  MODEL_VERBOSITY_UNSPECIFIED = 0;
  MODEL_VERBOSITY_LOW = 1;
  MODEL_VERBOSITY_MEDIUM = 2;
  MODEL_VERBOSITY_HIGH = 3;
}

enum CompactionMode {
  COMPACTION_MODE_UNSPECIFIED = 0;
  COMPACTION_MODE_NATIVE = 1;
  COMPACTION_MODE_LOCAL = 2;
  COMPACTION_MODE_NONE = 3;
}

enum BackgroundShellOutputMode {
  BACKGROUND_SHELL_OUTPUT_MODE_UNSPECIFIED = 0;
  BACKGROUND_SHELL_OUTPUT_MODE_DEFAULT = 1;
  BACKGROUND_SHELL_OUTPUT_MODE_VERBOSE = 2;
  BACKGROUND_SHELL_OUTPUT_MODE_CONCISE = 3;
}

enum ShellPostprocessingMode {
  SHELL_POSTPROCESSING_MODE_UNSPECIFIED = 0;
  SHELL_POSTPROCESSING_MODE_NONE = 1;
  SHELL_POSTPROCESSING_MODE_BUILTIN = 2;
  SHELL_POSTPROCESSING_MODE_USER = 3;
  SHELL_POSTPROCESSING_MODE_ALL = 4;
}

enum CacheWarningMode {
  CACHE_WARNING_MODE_UNSPECIFIED = 0;
  CACHE_WARNING_MODE_OFF = 1;
  CACHE_WARNING_MODE_DEFAULT = 2;
  CACHE_WARNING_MODE_VERBOSE = 3;
}

enum WorkflowCompletionMode {
  WORKFLOW_COMPLETION_MODE_UNSPECIFIED = 0;
  WORKFLOW_COMPLETION_MODE_AUTO = 1;
  WORKFLOW_COMPLETION_MODE_STRUCTURED_OUTPUT = 2;
  WORKFLOW_COMPLETION_MODE_TOOL = 3;
  WORKFLOW_COMPLETION_MODE_SHELL_COMMAND = 4;
  WORKFLOW_COMPLETION_MODE_UNSTRUCTURED_OUTPUT = 5;
}

enum SleepPreventionMode {
  SLEEP_PREVENTION_MODE_UNSPECIFIED = 0;
  SLEEP_PREVENTION_MODE_ALWAYS = 1;
  SLEEP_PREVENTION_MODE_ACTIVE = 2;
  SLEEP_PREVENTION_MODE_NEVER = 3;
}

enum SystemPromptFileScope {
  SYSTEM_PROMPT_FILE_SCOPE_UNSPECIFIED = 0;
  SYSTEM_PROMPT_FILE_SCOPE_HOME_CONFIG = 1;
  SYSTEM_PROMPT_FILE_SCOPE_WORKSPACE_CONFIG = 2;
  SYSTEM_PROMPT_FILE_SCOPE_SUBAGENT = 3;
}

message SystemPromptFile {
  string path = 1 [(buf.validate.field).string.min_len = 1];
  SystemPromptFileScope scope = 2 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

message ModelCapabilitiesOverride {
  bool supports_reasoning_effort = 1;
  bool supports_vision_inputs = 2;
}

message TimeoutSettings {
  int32 model_request_seconds = 1 [(buf.validate.field).int32.gt = 0];
}

message ShellSettings {
  ShellPostprocessingMode postprocessing_mode = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string postprocess_hook = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.session_launch.shell_postprocess_hook_nonblank"
      message: "postprocess_hook must be non-blank when present"
      expression: "this.trim() != ''"
    }
  ];
}

message WorktreeSettings {
  string base_dir = 1;
  string setup_script = 2;
  int32 setup_timeout_seconds = 3 [(buf.validate.field).int32.gte = 0];
}

message WorkflowSettings {
  WorkflowCompletionMode completion_mode = 1 [(buf.validate.field).enum.defined_only = true];
  int32 concurrency = 2 [(buf.validate.field).int32.gte = 0];
  int32 max_invalid_completion_attempts = 3 [(buf.validate.field).int32.gte = 0];
  optional int32 pre_compaction_tokens = 4 [(buf.validate.field).int32.gt = 0];
  bool use_required_tool_calls = 5;
  bool subagents = 6;
}

message ReviewerSettings {
  string frequency = 1;
  string model = 2;
  string thinking_level = 3;
  ModelVerbosity model_verbosity = 4 [(buf.validate.field).enum.defined_only = true];
  ModelCapabilitiesOverride model_capabilities = 7 [(buf.validate.field).required = true];
  int32 model_context_window = 9 [(buf.validate.field).int32.gte = 40000];
  optional string connection = 15 [(buf.validate.field).string.min_len = 1];
  optional string system_prompt_file = 14 [(buf.validate.field).string.min_len = 1];
  int32 timeout_seconds = 12 [(buf.validate.field).int32.gt = 0];
  bool verbose_output = 13;
}

message SubagentRole {
  Settings settings = 1 [(buf.validate.field).required = true];
  repeated SourceFact sources = 8;
  string description = 3 [(buf.validate.field).string.max_len = 5000];
  bool agent_callable = 4;
  bool workflow_subagent = 6;
  kent.api.auth.ConnectionSelection connection_selection = 9;
}

enum ConfigFileLayer {
  CONFIG_FILE_LAYER_UNSPECIFIED = 0;
  CONFIG_FILE_LAYER_GLOBAL = 1;
  CONFIG_FILE_LAYER_WORKSPACE = 2;
  CONFIG_FILE_LAYER_PRIVATE = 3;
}

message ConfigFileSource {
  ConfigFileLayer layer = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string path = 2 [(buf.validate.field).string.min_len = 1];
}

message ConfigPropertyAddress {
  string key = 1 [(buf.validate.field).string.min_len = 1];
  optional string role = 2 [(buf.validate.field).string.min_len = 1];
}

message ConfigOrigin {
  ConfigPropertyAddress property = 1 [(buf.validate.field).required = true];
  optional string retained_session_id = 8 [(buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true];
  oneof source {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty default_value = 2;
    ConfigFileSource file = 3;
    string environment = 4 [(buf.validate.field).string.min_len = 1];
    string cli_option = 5 [(buf.validate.field).string.min_len = 1];
    google.protobuf.Empty input = 6;
    google.protobuf.Empty session = 7;
  }
}

message SourceFact {
  string key = 1 [(buf.validate.field).string.min_len = 1];
  ConfigOrigin origin = 2 [(buf.validate.field).required = true];
}

message ToolSelection {
  option (buf.validate.message).cel = {
    id: "kent.session_launch.tool_selection_origin"
    message: "tool selection requires an unscoped tools declaration from a nonblank environment variable or CLI option"
    expression: "this.origin.property.key == 'tools' && !has(this.origin.property.role) && "
      "((has(this.origin.environment) && this.origin.environment.trim() != '') || "
      "(has(this.origin.cli_option) && this.origin.cli_option.trim() != ''))"
  };
  repeated ToolID tools = 1 [(buf.validate.field).repeated = {
    unique: true
    items: {enum: {defined_only: true, not_in: [0]}}
  }];
  ConfigOrigin origin = 2 [(buf.validate.field).required = true];
}

message BooleanFact {
  string key = 1 [(buf.validate.field).string.min_len = 1];
  bool value = 2;
}

message NamedSubagentRole {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  SubagentRole role = 2 [(buf.validate.field).required = true];
}

enum ToolID {
  TOOL_ID_UNSPECIFIED = 0;
  TOOL_ID_EXEC_COMMAND = 1;
  TOOL_ID_WRITE_STDIN = 2;
  TOOL_ID_VIEW_IMAGE = 3;
  TOOL_ID_PATCH = 4;
  TOOL_ID_EDIT = 5;
  TOOL_ID_ASK_QUESTION = 6;
  TOOL_ID_COMPLETE_NODE = 7;
  TOOL_ID_TRIGGER_HANDOFF = 8;
  TOOL_ID_WEB_SEARCH = 9;
}

message ToolEnabledFact {
  ToolID tool_id = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bool enabled = 2;
}

message Settings {
  option (buf.validate.message).cel = {
    id: "kent.session_launch.compaction_threshold_below_model_window"
    message: "context_compaction_threshold_tokens must be less than model_context_window"
    expression: "this.context_compaction_threshold_tokens < this.model_context_window"
  };

  string model = 1;
  string thinking_level = 2;
  ModelVerbosity model_verbosity = 3 [(buf.validate.field).enum.defined_only = true];
  SystemPromptFile system_prompt_file = 39;
  ModelCapabilitiesOverride model_capabilities = 6 [(buf.validate.field).required = true];
  string theme = 7 [(buf.validate.field).string = {
    in: ["auto", "light", "dark"]
  }];
  bool tui_native_progress_bar = 41;
  string notification_method = 8;
  bool tool_preambles = 9;
  bool priority_request_mode = 10;
  bool debug = 11;
  string server_host = 12;
  int32 server_port = 13 [
    (buf.validate.field).int32 = {
      gt: 0
      lte: 65535
    }
  ];
  string web_search = 14;
  string provider_identifier = 16;
  optional string connection = 40 [(buf.validate.field).string.min_len = 1];
  bool store = 19;
  bool allow_non_cwd_edits = 20;
  int32 model_context_window = 21 [(buf.validate.field).int32.gte = 40000];
  int32 context_compaction_threshold_tokens = 22 [(buf.validate.field).int32.gt = 0];
  optional int32 pre_submit_compaction_lead_tokens = 23 [(buf.validate.field).int32.gt = 0];
  int32 minimum_exec_to_bg_seconds = 24 [(buf.validate.field).int32.gt = 0];
  CompactionMode compaction_mode = 25 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated ToolEnabledFact enabled_tools = 26;
  repeated BooleanFact skill_toggles = 27;
  TimeoutSettings timeouts = 28 [(buf.validate.field).required = true];
  int32 shell_output_max_chars = 29 [(buf.validate.field).int32.gt = 0];
  BackgroundShellOutputMode bg_shells_output = 30 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  ShellSettings shell = 31 [(buf.validate.field).required = true];
  CacheWarningMode cache_warning_mode = 32 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  WorktreeSettings worktrees = 33 [(buf.validate.field).required = true];
  WorkflowSettings workflow = 34 [(buf.validate.field).required = true];
  ReviewerSettings reviewer = 35 [(buf.validate.field).required = true];
  repeated NamedSubagentRole subagents = 36;
  int32 max_subagent_depth = 37 [(buf.validate.field).int32.gte = 0];
  SleepPreventionMode prevent_sleep = 38 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message SourceReport {
  bool created_default_config = 3;
  repeated SourceFact sources = 10;
  repeated ConfigFileReport files = 11;
}

message ConfigFileReport {
  ConfigFileSource file = 1 [(buf.validate.field).required = true];
  bool exists = 2;
  bool enabled = 3;
  bool applied = 4;
}

