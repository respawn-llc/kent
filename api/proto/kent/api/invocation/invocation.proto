syntax = "proto3";

package kent.api.invocation;

import "buf/validate/validate.proto";

option go_package = "core/shared/protoapi/gen/kent/api/invocation;invocationpb";

message RunPromptOverrides {
  optional string agent_role = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.session_launch.run_prompt_agent_role_nonblank"
      message: "agent_role must be non-blank when present"
      expression: "this.trim() != ''"
    }
  ];
  optional string model = 2 [(buf.validate.field).string.min_len = 1];
  optional string thinking_level = 4 [(buf.validate.field).string.min_len = 1];
  optional string theme = 5 [
    (buf.validate.field).string = {
      in: ["auto", "light", "dark"]
    }
  ];
  optional int32 model_timeout_seconds = 6 [(buf.validate.field).int32.gte = 1];
  optional string tools = 7 [(buf.validate.field).string.min_len = 1];
}
