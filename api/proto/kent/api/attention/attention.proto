syntax = "proto3";

package kent.api.attention;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "kent/api/auth/auth.proto";
import "kent/api/prompt/prompt.proto";
import "kent/api/server/server.proto";
import "kent/api/shared/foundation.proto";
import "kent/api/shared/validation.proto";

option go_package = "core/shared/protoapi/gen/kent/api/attention;attentionpb";

enum Kind {
  ATTENTION_KIND_UNSPECIFIED = 0;
  ATTENTION_KIND_QUESTION = 1;
  ATTENTION_KIND_APPROVAL = 2;
}

message NotificationID {
  Kind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string uuid = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.(kent.api.shared.nonblank) = true
  ];
}

message QuestionState {
  string preview = 5;
  int32 display_count = 6 [(buf.validate.field).int32.gt = 0];
}

message ApprovalState {
  optional string message = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.attention.approval_message_nonblank"
      message: "approval message must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  repeated kent.api.prompt.FileAccessTarget access_targets = 2 [(buf.validate.field).repeated.items.required = true];

  option (buf.validate.message).cel = {
    id: "kent.attention.approval_presentation"
    message: "approval must carry either message copy or access targets"
    expression: "has(this.message) != (size(this.access_targets) > 0)"
  };
}

message Notification {
  optional int64 short_id = 8 [(buf.validate.field).int64 = {gt: 0 lte: 9007199254740991}];
  NotificationID id = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp occurred_at = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
  uint64 revision = 4 [(buf.validate.field).uint64 = {
    gte: 1
    lte: 9007199254740991
  }];
  string session_id = 5 [(buf.validate.field).string.uuid = true, (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true];
  oneof state {
    option (buf.validate.oneof).required = true;
    QuestionState question = 6;
    ApprovalState approval = 7;
  }

  option (buf.validate.message).cel = {
    id: "kent.attention.notification_kind"
    message: "notification id kind must match its state"
    expression:
      "(this.id.kind == 1 && has(this.question)) || "
      "(this.id.kind == 2 && has(this.approval))"
  };
}

message Resolved {
  NotificationID id = 2 [(buf.validate.field).required = true];
  google.protobuf.Timestamp occurred_at = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}

message SessionNamingFailure {
  string project_id = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string session_id = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  kent.api.shared.InternalFailureDetails error = 3 [(buf.validate.field).required = true];
}

message SessionTurnEnd {
  string project_id = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string session_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  optional int64 short_id = 3 [(buf.validate.field).int64 = {gt: 0 lte: 9007199254740991}];
  optional string session_name = 4 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string assistant_content = 5;
  google.protobuf.Timestamp completed_at = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}

message NotificationEvent {
  uint64 sequence = 1 [(buf.validate.field).uint64 = {
    gte: 1
    lte: 9007199254740991
  }];
  oneof payload {
    option (buf.validate.oneof).required = true;
    Notification pending = 2;
    Resolved resolved = 3;
    SessionNamingFailure session_naming_failure = 4;
    SessionTurnEnd session_turn_end = 5;
  }
}

message SubscribeRequest {
  string session_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
}

message StartError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];

    kent.api.auth.AuthRequiredDetails auth_required = 3 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "auth_required"
    }];

    kent.api.server.ServerNotReadyDetails server_not_ready = 4 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "server_not_ready"
    }];
  }
}

message StartResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    StartError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

service SessionService {
  rpc Subscribe(SubscribeRequest) returns (StartResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_SUBSCRIPTION
      authentication_stage: AUTHENTICATION_STAGE_SERVER
      scope_policy: SCOPE_POLICY_ATTACHED_SESSION
      direction: DIRECTION_CLIENT_TO_SERVER
      event: {
        package: "kent.api.attention"
        service: "SessionService"
        method: "Event"
      }
      completion: {
        package: "kent.api.attention"
        service: "SessionService"
        method: "Complete"
      }
    };
  }
  rpc Event(NotificationEvent) returns (google.protobuf.Empty) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_NOTIFICATION
      authentication_stage: AUTHENTICATION_STAGE_NONE
      scope_policy: SCOPE_POLICY_NOTIFICATION
      direction: DIRECTION_SERVER_TO_CLIENT
    };
  }
  rpc Complete(kent.api.shared.StreamCompletion) returns (google.protobuf.Empty) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_NOTIFICATION
      authentication_stage: AUTHENTICATION_STAGE_NONE
      scope_policy: SCOPE_POLICY_NOTIFICATION
      direction: DIRECTION_SERVER_TO_CLIENT
    };
  }
}
