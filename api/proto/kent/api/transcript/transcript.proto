    ThinkingStatusUpdate thinking_status_update = 6;
    ReasoningTraceUpdate reasoning_trace_update = 7;
    ReasoningTraceReset reasoning_trace_reset = 8;
    ToolStart tool_start = 9;
    ToolAbort tool_abort = 10;
    UserMessageFlushed user_message_flushed = 11;
    QueuedMessageState queued_message_state = 12;
    StepState step_state = 13;
    kent.api.runtime.ReadModelUpdate runtime_read_model_update = 15;
    SessionStatus session_status = 16;
    SessionIdentity session_identity = 17;
    CompactionStatus compaction_status = 18;
    kent.api.runtime.ContextUsage context_usage = 19;
    kent.api.runtime.GoalView goal_status = 20;
    BackgroundActivity background_activity = 21;
    Prompt prompt = 22;
    WorktreeTransitionOutcome worktree_transition_outcome = 23;
    OperationalDiagnostic operational_diagnostic = 24;
    LiveRunFinished live_run_finished = 25;
    PendingWorkChanged pending_work_changed = 26;
    PendingWorkRestored pending_work_restored = 27;
    SessionSettingFeedback session_setting_feedback = 28;
    HumanInputInterrupted human_input_interrupted = 29;
    ConnectionReplacement connection_replaced = 30;
  }
}

message Message {
  uint64 sequence = 1 [(buf.validate.field).uint64 = {
    gte: 1
    lte: 9007199254740991
  }];
  Event event = 2 [(buf.validate.field).required = true];
  option (buf.validate.message).cel = {
    id: "kent.transcript.message_sequence"
    message: "hydration is sequence 1 and live events begin at sequence 2"
    expression: "(has(this.event.hydration) && this.sequence == 1u) || (!has(this.event.hydration) && this.sequence >= 2u)"
  };
}

message PageRequest {
  string session_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.page_request_session_id_nonblank"
      message: "session ID must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  oneof direction {
    int64 cursor = 2 [(buf.validate.field).int64 = {
      gte: 1
      lte: 9007199254740991
    }];
    int64 newer_cursor = 3 [(buf.validate.field).int64 = {
      gte: 1
      lte: 9007199254740991
    }];
  }
}

message RollbackCandidate {
  int64 user_message_seq = 1 [(buf.validate.field).int64 = {
    gte: 1
    lte: 9007199254740991
  }];
  int64 candidate_page_end_byte = 2 [(buf.validate.field).int64 = {
    gte: 1
    lte: 9007199254740991
  }];
}

message Page {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string session_name = 2 [(buf.validate.field).string.min_len = 1];
  kent.api.runtime.ConversationFreshness conversation_freshness = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional int64 older_cursor = 4 [(buf.validate.field).int64 = {
    gte: 1
    lte: 9007199254740991
  }];
  bool has_more_above = 5;
  optional int64 newer_cursor = 6 [(buf.validate.field).int64 = {
    gte: 1
    lte: 9007199254740991
  }];
  bool has_more_below = 7;
  optional RollbackCandidate latest_rollback_candidate = 8;
  repeated CommittedRow entries = 9 [(buf.validate.field).repeated.items.required = true];
  option (buf.validate.message).cel = {
    id: "kent.transcript.page_older_cursor"
    message: "older_cursor presence must match has_more_above"
    expression: "this.has_more_above == has(this.older_cursor)"
  };
  option (buf.validate.message).cel = {
    id: "kent.transcript.page_newer_cursor"
    message: "newer_cursor presence must match has_more_below"
    expression: "this.has_more_below == has(this.newer_cursor)"
  };
  option (buf.validate.message).cel = {
    id: "kent.transcript.page_unique_locators"
    message: "transcript page committed row locators must be unique"
    expression: "this.entries.map(entry, string(entry.locator.event_sequence) + ':' + string(entry.locator.row_ordinal)).unique()"
  };
}

message PageSuccess {
  Page transcript = 1 [(buf.validate.field).required = true];
}
message LatestFinalAnswerRequest {
  string session_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.latest_final_answer_session_id_nonblank"
      message: "session ID must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
}
message LatestFinalAnswerSuccess {
  optional string answer = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.latest_final_answer_nonblank"
      message: "answer must be non-blank when present"
      expression: "this.trim() != ''"
    }
  ];
}
message SubscribeRequest {
  string session_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.subscribe_session_id_nonblank"
      message: "session ID must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
}
message AppendCommittedEntryRequest {
  string session_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.append_entry_session_id_nonblank"
      message: "session ID must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  string role = 2;
  string text = 3;
  optional AppendVisibility visibility = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string notice_id = 5 [(buf.validate.field).string.min_len = 1];
}
message PageError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.server.ServerNotReadyDetails server_not_ready = 3 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "server_not_ready"
    }];
    kent.api.shared.InternalFailureDetails internal_failure = 2 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];
  }
}

message LatestFinalAnswerError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];
    kent.api.server.ServerNotReadyDetails server_not_ready = 3 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "server_not_ready"
    }];
  }
}
message SubscribeError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];
    kent.api.auth.AuthRequiredDetails auth_required = 3 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "auth_required"
    }];

    kent.api.server.ServerNotReadyDetails server_not_ready = 4 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "server_not_ready"
    }];
  }
}
message AppendCommittedEntryError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];
    kent.api.runtime.RuntimeUnavailableDetails runtime_unavailable = 3 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "runtime_unavailable"
    }];
    kent.api.server.ServerNotReadyDetails server_not_ready = 4 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "server_not_ready"
    }];

    kent.api.auth.AuthRequiredDetails auth_required = 5 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "auth_required"
    }];
  }
}

message PageResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    PageSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    PageError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}
message LatestFinalAnswerResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    LatestFinalAnswerSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    LatestFinalAnswerError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}
message SubscribeResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    SubscribeError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}
message AppendCommittedEntryResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    AppendCommittedEntryError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

service ReadService {
  rpc GetPage(PageRequest) returns (PageResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_UNARY
      authentication_stage: AUTHENTICATION_STAGE_PRE_SERVER
      scope_policy: SCOPE_POLICY_SESSION_ACTIVE_PROJECT
      direction: DIRECTION_CLIENT_TO_SERVER
      unary_connection: UNARY_CONNECTION_MULTIPLEXED
    };
  }
  rpc GetLatestFinalAnswer(LatestFinalAnswerRequest) returns (LatestFinalAnswerResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_UNARY
      authentication_stage: AUTHENTICATION_STAGE_PRE_SERVER
      scope_policy: SCOPE_POLICY_SESSION_ACTIVE_PROJECT
      direction: DIRECTION_CLIENT_TO_SERVER
      unary_connection: UNARY_CONNECTION_MULTIPLEXED
    };
  }
}

service StreamService {
  rpc Subscribe(SubscribeRequest) returns (SubscribeResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_SUBSCRIPTION
      authentication_stage: AUTHENTICATION_STAGE_SERVER
      scope_policy: SCOPE_POLICY_ATTACHED_SESSION
      direction: DIRECTION_CLIENT_TO_SERVER
      event: {
        package: "kent.api.transcript"
        service: "StreamService"
        method: "Event"
      }
      completion: {
        package: "kent.api.transcript"
        service: "StreamService"
        method: "Complete"
      }
    };
  }
  rpc Event(Message) returns (google.protobuf.Empty) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_NOTIFICATION
      authentication_stage: AUTHENTICATION_STAGE_NONE
      scope_policy: SCOPE_POLICY_NOTIFICATION
      direction: DIRECTION_SERVER_TO_CLIENT
    };
  }
  rpc Complete(kent.api.shared.StreamCompletion) returns (google.protobuf.Empty) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_NOTIFICATION
      authentication_stage: AUTHENTICATION_STAGE_NONE
      scope_policy: SCOPE_POLICY_NOTIFICATION
      direction: DIRECTION_SERVER_TO_CLIENT
    };
  }
}

service AppendService {
  rpc AppendCommittedEntry(AppendCommittedEntryRequest) returns (AppendCommittedEntryResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_UNARY
      authentication_stage: AUTHENTICATION_STAGE_SERVER
      scope_policy: SCOPE_POLICY_SESSION_ACTIVE_PROJECT
      direction: DIRECTION_CLIENT_TO_SERVER
      unary_connection: UNARY_CONNECTION_MULTIPLEXED
    };
  }
}
