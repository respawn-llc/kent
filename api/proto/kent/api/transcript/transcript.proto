syntax = "proto3";

package kent.api.transcript;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "kent/api/auth/auth.proto";
import "kent/api/prompt/prompt.proto";
import "kent/api/runtime/runtime.proto";
import "kent/api/server/server.proto";
import "kent/api/shared/foundation.proto";
import "kent/api/shared/validation.proto";
import "kent/api/transcript/tool_presentation.proto";
import "kent/api/worktree/worktree.proto";

option go_package = "core/shared/protoapi/gen/kent/api/transcript;transcriptpb";

enum EntryVisibility {
  ENTRY_VISIBILITY_UNSPECIFIED = 0;
  ENTRY_VISIBILITY_ONGOING = 1;
  ENTRY_VISIBILITY_ONGOING_COLLAPSED = 2;
  ENTRY_VISIBILITY_DETAIL = 3;
  ENTRY_VISIBILITY_HIDDEN = 4;
}

enum AppendVisibility {
  APPEND_VISIBILITY_UNSPECIFIED = 0;
  APPEND_VISIBILITY_AUTO = 1;
  APPEND_VISIBILITY_ONGOING = 2;
  APPEND_VISIBILITY_ONGOING_COLLAPSED = 3;
  APPEND_VISIBILITY_DETAIL = 4;
  APPEND_VISIBILITY_HIDDEN = 5;
}

enum RowIntegrity {
  ROW_INTEGRITY_UNSPECIFIED = 0;
  ROW_INTEGRITY_VALID = 1;
  ROW_INTEGRITY_RECOVERABLE_MALFORMED = 2;
  ROW_INTEGRITY_UNRECOVERABLE_MALFORMED = 3;
}

enum AssistantPhase {
  ASSISTANT_PHASE_UNSPECIFIED = 0;
  ASSISTANT_PHASE_COMMENTARY = 1;
  ASSISTANT_PHASE_FINAL = 2;
}

enum AssistantAbortReason {
  ASSISTANT_ABORT_REASON_UNSPECIFIED = 0;
  ASSISTANT_ABORT_REASON_INTERRUPTED = 1;
  ASSISTANT_ABORT_REASON_FAILED = 2;
  ASSISTANT_ABORT_REASON_SUPERSEDED = 3;
}

enum ToolAbortReason {
  TOOL_ABORT_REASON_UNSPECIFIED = 0;
  TOOL_ABORT_REASON_CANCELED = 1;
  TOOL_ABORT_REASON_FAILED = 2;
}

enum QueuedMessageStatus {
  QUEUED_MESSAGE_STATUS_UNSPECIFIED = 0;
  QUEUED_MESSAGE_STATUS_ACCEPTED = 1;
  QUEUED_MESSAGE_STATUS_SUBMITTED = 2;
  QUEUED_MESSAGE_STATUS_FAILED = 3;
  QUEUED_MESSAGE_STATUS_DISCARDED = 4;
}

enum QueuedMessageFailureReason {
  QUEUED_MESSAGE_FAILURE_REASON_UNSPECIFIED = 0;
  QUEUED_MESSAGE_FAILURE_REASON_CLOSING = 1;
  QUEUED_MESSAGE_FAILURE_REASON_TERMINAL_WORKFLOW_COMPLETION = 2;
  QUEUED_MESSAGE_FAILURE_REASON_RUNTIME_UNAVAILABLE = 3;
  QUEUED_MESSAGE_FAILURE_REASON_STOPPED = 4;
}

enum StepLifecycle {
  STEP_LIFECYCLE_UNSPECIFIED = 0;
  STEP_LIFECYCLE_STARTED = 1;
  STEP_LIFECYCLE_FINISHED = 2;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_RUNNING = 1;
  RUN_STATUS_COMPLETED = 2;
  RUN_STATUS_INTERRUPTED = 3;
  RUN_STATUS_FAILED = 4;
}

enum CompactionState {
  COMPACTION_STATE_UNSPECIFIED = 0;
  COMPACTION_STATE_STARTED = 1;
  COMPACTION_STATE_COMPLETED = 2;
  COMPACTION_STATE_FAILED = 3;
}

enum BackgroundLifecycle {
  BACKGROUND_LIFECYCLE_UNSPECIFIED = 0;
  BACKGROUND_LIFECYCLE_BACKGROUNDED = 1;
  BACKGROUND_LIFECYCLE_COMPLETED = 2;
  BACKGROUND_LIFECYCLE_KILLED = 3;
}

enum PromptStatus {
  PROMPT_STATUS_UNSPECIFIED = 0;
  PROMPT_STATUS_PENDING = 1;
  PROMPT_STATUS_RESOLVED = 2;
}

enum OperationalDiagnosticCode {
  OPERATIONAL_DIAGNOSTIC_CODE_UNSPECIFIED = 0;
  OPERATIONAL_DIAGNOSTIC_CODE_SLEEP_GUARD_FAILED = 1;
  OPERATIONAL_DIAGNOSTIC_CODE_PROMPT_HISTORY_PERSIST_FAILED = 2;
  OPERATIONAL_DIAGNOSTIC_CODE_IN_FLIGHT_CLEAR_FAILED = 3;
  OPERATIONAL_DIAGNOSTIC_CODE_PROVIDER_TURN_STATE_INVALID = 4;
  OPERATIONAL_DIAGNOSTIC_CODE_CONTEXT_FACTS_PERSIST_FAILED = 5;
}

enum LiveRunStatus {
  LIVE_RUN_STATUS_UNSPECIFIED = 0;
  LIVE_RUN_STATUS_COMPLETED = 1;
  LIVE_RUN_STATUS_INTERRUPTED = 2;
  LIVE_RUN_STATUS_FAILED = 3;
}

enum LiveRunResultKind {
  LIVE_RUN_RESULT_KIND_UNSPECIFIED = 0;
  LIVE_RUN_RESULT_KIND_ASSISTANT_FINAL_ANSWER = 1;
  LIVE_RUN_RESULT_KIND_NO_FINAL_ANSWER = 2;
}

enum NoticeReason {
  NOTICE_REASON_UNSPECIFIED = 0;
  NOTICE_REASON_CACHE_WARNING = 1;
  NOTICE_REASON_COMPACTION = 2;
  NOTICE_REASON_LEGACY_UNTYPED_NOTICE = 3;
  NOTICE_REASON_RUNTIME_DIAGNOSTIC = 4;
  NOTICE_REASON_TOOL_OUTPUT_REPAIR = 5;
  NOTICE_REASON_PROVIDER_MODEL_MISMATCH = 6;
  NOTICE_REASON_THINKING_UPDATE = 7;
}

enum NoticeSeverity {
  NOTICE_SEVERITY_UNSPECIFIED = 0;
  NOTICE_SEVERITY_INFO = 1;
  NOTICE_SEVERITY_WARNING = 2;
  NOTICE_SEVERITY_ERROR = 3;
}

enum NoticeMessageType {
  NOTICE_MESSAGE_TYPE_UNSPECIFIED = 0;
  NOTICE_MESSAGE_TYPE_AGENTS_MD = 1;
  NOTICE_MESSAGE_TYPE_SKILLS = 2;
  NOTICE_MESSAGE_TYPE_SUBAGENTS = 3;
  NOTICE_MESSAGE_TYPE_ENVIRONMENT = 4;
  NOTICE_MESSAGE_TYPE_COMPACTION_SUMMARY = 5;
  NOTICE_MESSAGE_TYPE_INTERRUPTION = 6;
  NOTICE_MESSAGE_TYPE_ERROR_FEEDBACK = 7;
  NOTICE_MESSAGE_TYPE_COMPACTION_SOON_REMINDER = 8;
  NOTICE_MESSAGE_TYPE_HANDOFF_FUTURE_MESSAGE = 9;
  NOTICE_MESSAGE_TYPE_REVIEWER_FEEDBACK = 10;
  NOTICE_MESSAGE_TYPE_BACKGROUND_NOTICE = 11;
  NOTICE_MESSAGE_TYPE_CUSTOM_TOOL_CALL_OUTPUT = 12;
  NOTICE_MESSAGE_TYPE_COMPACTION_PRESERVED_USER_MESSAGE = 13;
  NOTICE_MESSAGE_TYPE_HEADLESS_MODE = 14;
  NOTICE_MESSAGE_TYPE_HEADLESS_MODE_EXIT = 15;
  NOTICE_MESSAGE_TYPE_WORKFLOW_MODE = 16;
  NOTICE_MESSAGE_TYPE_WORKTREE_MODE = 17;
  NOTICE_MESSAGE_TYPE_WORKTREE_MODE_EXIT = 18;
  NOTICE_MESSAGE_TYPE_GOAL = 19;
  NOTICE_MESSAGE_TYPE_ACTIVE_GOAL_CONTINUATION = 20;
  NOTICE_MESSAGE_TYPE_AGENT_STEER = 21;
  NOTICE_MESSAGE_TYPE_WORKFLOW_MODE_EXIT = 22;
  NOTICE_MESSAGE_TYPE_SESSION_REBIND = 23;
  NOTICE_MESSAGE_TYPE_USER_SHELL_COMMAND = 24;
}

message Diagnostic {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.diagnostic_code_nonblank"
      message: "diagnostic code must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  string detail = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.diagnostic_detail_nonblank"
      message: "diagnostic detail must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
}

message CommittedRowLocator {
  int64 event_sequence = 1 [(buf.validate.field).int64 = {
    gte: 1
    lte: 9007199254740991
  }];
  int32 row_ordinal = 2 [(buf.validate.field).int32.gte = 1];
}

message UserRow {
  optional string step_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  string text = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.user_row_text_nonblank"
      message: "user row text must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional string condensed_text = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.user_row_condensed_text_nonblank"
      message: "condensed user row text must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional string rollback_target_id = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.user_row_rollback_target_nonblank"
      message: "rollback target ID must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional google.protobuf.Timestamp committed_at = 5;
}

message AssistantRow {
  string step_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  optional string stream_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  AssistantPhase phase = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional google.protobuf.Timestamp committed_at = 4;
  string text = 5 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional string condensed_text = 6 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
}

message ToolRow {
  optional string step_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  optional string tool_call_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.tool_row_call_id_nonblank"
      message: "tool call ID must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional string tool_name = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.tool_row_name_nonblank"
      message: "tool name must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  bool is_error = 4;
  string text = 5;
  optional string result_summary = 6 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional string condensed_text = 7 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional ToolPresentation presentation = 8;
  optional kent.api.prompt.QuestionAnswer question_answer = 9;
  optional WebSearchDetail web_search = 10;
  option (buf.validate.message).cel = {
    id: "kent.transcript.ask_result"
    message: "errored Ask Question results require nonblank failure text"
    expression: "!has(this.presentation) || this.presentation.presentation != 3 || !this.is_error || this.text.trim() != ''"
  };
  option (buf.validate.message).cel = {
    id: "kent.transcript.tool_row_patch_owner"
    message: "Patch/Edit tools require patch presentation and other tools cannot carry it"
    expression: "has(this.tool_name) && this.tool_name in ['patch', 'edit', 'replace', 'write'] ? (has(this.presentation) && has(this.presentation.patch_presentation)) : (!has(this.presentation) || !has(this.presentation.patch_presentation))"
  };
}

// Provider-supplied display text is validated nonempty text, not a URL policy.
// Sources and results preserve provider order, including repeated destinations.
message WebSearchDetail {
  oneof action {
    option (buf.validate.oneof).required = true;
    WebSearchSearch search = 1;
    WebSearchOpenPage open_page = 2;
    WebSearchFindInPage find_in_page = 3;
  }
  repeated WebSearchResult results = 4;
  repeated string sources = 5 [(buf.validate.field).repeated.items.string.min_len = 1];
  option (buf.validate.message).cel = {
    id: "kent.transcript.web_search_useful"
    message: "web search detail requires useful results, sources, or page facts"
    expression: "size(this.results) > 0 || size(this.sources) > 0 || (has(this.open_page) && has(this.open_page.url)) || (has(this.find_in_page) && (has(this.find_in_page.url) || has(this.find_in_page.pattern)))"
  };
}

message WebSearchSearch {
  repeated string queries = 1 [(buf.validate.field).repeated.items.string.min_len = 1];
}

message WebSearchOpenPage {
  optional string url = 1 [(buf.validate.field).string.min_len = 1];
}

message WebSearchFindInPage {
  optional string url = 1 [(buf.validate.field).string.min_len = 1];
  optional string pattern = 2 [(buf.validate.field).string.min_len = 1];
}

enum WebSearchResultKind {
  WEB_SEARCH_RESULT_KIND_UNSPECIFIED = 0;
  WEB_SEARCH_RESULT_KIND_LINK = 1;
  WEB_SEARCH_RESULT_KIND_IMAGE = 2;
}

message WebSearchResult {
  WebSearchResultKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string title = 2 [(buf.validate.field).string.min_len = 1];
  optional string destination = 3 [(buf.validate.field).string.min_len = 1];
  option (buf.validate.message).cel = {
    id: "kent.transcript.web_search_result_useful"
    message: "web search result requires a title or destination"
    expression: "has(this.title) || has(this.destination)"
  };
}

message ReasoningTraceRow {
  string step_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  optional google.protobuf.Duration duration = 2 [(buf.validate.field).duration.gte = {}];
  string compact_text = 3 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string text = 4 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional ReasoningTraceIdentity provisional_identity = 5;
}

message ReviewerFeedbackRow {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  string step_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  int32 suggestion_count = 3 [(buf.validate.field).int32.gte = 1];
  repeated string suggestions = 4 [(buf.validate.field).repeated.items.string.(kent.api.shared.nonblank) = true];
  option (buf.validate.message).cel = {
    id: "kent.transcript.reviewer_suggestion_count"
    message: "suggestion count must match suggestions"
    expression: "this.suggestion_count == size(this.suggestions)"
  };
}

message ReviewerErrorRow {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  string step_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  string detail = 3 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
}

message CacheWarning {
  string scope = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.cache_warning_scope_nonblank"
      message: "cache-warning scope must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  string reason = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.cache_warning_reason_nonblank"
      message: "cache-warning reason must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional int32 lost_input_tokens = 3 [(buf.validate.field).int32.gte = 1];
  EntryVisibility visibility = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message CompactionNotice {
  optional int32 count = 1 [(buf.validate.field).int32.gte = 1];
  optional string detail = 2 [(buf.validate.field).string.min_len = 1];
}

message ToolOutputRepair {
  string kind = 1 [(buf.validate.field).string = {
    in: [
      "fresh_resource",
      "live_provider_rejection"
    ]
  }];
  int32 count = 2 [(buf.validate.field).int32.gte = 1];
}

message ProviderModelMismatch {
  string requested_model = 1 [(buf.validate.field).string.min_len = 1];
  string served_model = 2 [(buf.validate.field).string.min_len = 1];
}

message BackgroundNoticeIdentity {
  string activity_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  string process_id = 2 [(buf.validate.field).string.min_len = 1];
  optional int32 exit_code = 3;
}

message WorktreeContext {
  optional string branch = 1 [(buf.validate.field).string.min_len = 1];
  string worktree_path = 2 [(buf.validate.field).string.min_len = 1];
  string workspace_root = 3 [(buf.validate.field).string.min_len = 1];
  string effective_cwd = 4 [(buf.validate.field).string.min_len = 1];
}

message NoticeRow {
  optional string step_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  NoticeReason reason = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  NoticeSeverity severity = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional NoticeMessageType message_type = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string legacy_text = 5 [(buf.validate.field).string.min_len = 1];
  optional string notice_id = 6 [(buf.validate.field).string.min_len = 1];
  optional string source_path = 7 [(buf.validate.field).string.min_len = 1];
  optional WorktreeContext worktree = 8;
  optional CacheWarning cache_warning = 9;
  optional CompactionNotice compaction = 10;
  optional ToolOutputRepair tool_output_repair = 11;
  optional Diagnostic diagnostic = 12;
  optional BackgroundNoticeIdentity background = 13;
  optional string condensed_text = 14 [(buf.validate.field).string.min_len = 1];
  optional string compact_label = 15 [(buf.validate.field).string.min_len = 1];
  optional ProviderModelMismatch provider_model_mismatch = 16;
  optional string thinking_effort = 18 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.thinking_effort_nonblank"
      message: "Thinking effort must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  option (buf.validate.message).cel = {
    id: "kent.transcript.thinking_effort_reason"
    message: "Thinking effort requires a Thinking-update notice and vice versa"
    expression: "has(this.thinking_effort) == (this.reason == 7)"
  };
  option (buf.validate.message).cel = {
    id: "kent.transcript.metadata_only_legacy_error"
    message: "legacy errors without text require typed Worktree metadata"
    expression: "this.reason != 3 || this.severity != 3 || has(this.legacy_text) || (has(this.worktree) && has(this.message_type) && this.message_type in [17, 18])"
  };
  option (buf.validate.message).cel = {
    id: "kent.transcript.notice_reason_payload"
    message: "notice payload must match reason"
    expression:
      "(this.reason == 1 && has(this.cache_warning) && !has(this.legacy_text) && !has(this.compaction) && !has(this.tool_output_repair) && !has(this.provider_model_mismatch) && !has(this.diagnostic) && !has(this.background)) || "
      "(this.reason == 2 && has(this.compaction) && has(this.message_type) && this.message_type == 5 && !has(this.legacy_text) && !has(this.cache_warning) && !has(this.tool_output_repair) && !has(this.provider_model_mismatch) && !has(this.diagnostic) && !has(this.background)) || "
      "(this.reason == 3 && (has(this.legacy_text) || has(this.message_type)) && !has(this.cache_warning) && !has(this.compaction) && !has(this.tool_output_repair) && !has(this.provider_model_mismatch) && !has(this.diagnostic) && !has(this.background)) || "
      "(this.reason == 4 && has(this.diagnostic) && !has(this.legacy_text) && !has(this.cache_warning) && !has(this.compaction) && !has(this.tool_output_repair) && !has(this.provider_model_mismatch)) || "
      "(this.reason == 5 && has(this.tool_output_repair) && !has(this.legacy_text) && !has(this.cache_warning) && !has(this.compaction) && !has(this.provider_model_mismatch) && !has(this.diagnostic) && !has(this.background)) || "
      "(this.reason == 6 && has(this.provider_model_mismatch) && !has(this.legacy_text) && !has(this.cache_warning) && !has(this.compaction) && !has(this.tool_output_repair) && !has(this.diagnostic) && !has(this.background)) || "
      "(this.reason == 7 && this.severity == 1 && !has(this.message_type) && !has(this.legacy_text) && !has(this.cache_warning) && !has(this.compaction) && !has(this.tool_output_repair) && !has(this.provider_model_mismatch) && !has(this.diagnostic) && !has(this.background))"
  };
}

message CommittedRow {
  EntryVisibility visibility = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  RowIntegrity integrity = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  CommittedRowLocator locator = 3 [(buf.validate.field).required = true];
  option (buf.validate.message).cel = {
    id: "kent.transcript.valid_tool_identity"
    message: "valid committed tool rows require tool identity"
    expression: "this.integrity != 1 || !has(this.tool) || (has(this.tool.tool_call_id) && has(this.tool.tool_name))"
  };
  oneof row {
    option (buf.validate.oneof).required = true;
    UserRow user = 4;
    AssistantRow assistant = 5;
    ToolRow tool = 6;
    ReasoningTraceRow reasoning_trace = 7;
    NoticeRow notice = 8;
    ReviewerFeedbackRow reviewer_feedback = 9;
    ReviewerErrorRow reviewer_error = 10;
  }
  option (buf.validate.message).cel = {
    id: "kent.transcript.reviewer_error_visibility"
    message: "reviewer error rows must use ongoing visibility"
    expression: "!has(this.reviewer_error) || this.visibility == 1"
  };
}

message SessionIdentity {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string session_name = 2 [(buf.validate.field).string.min_len = 1];
  kent.api.runtime.ConversationFreshness conversation_freshness = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional kent.api.worktree.SessionExecutionTarget execution_target = 4;
}

message SessionStatus {
  string reviewer_frequency = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.session_reviewer_frequency_nonblank"
      message: "reviewer_frequency must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  bool reviewer_enabled = 2;
  bool auto_compaction_enabled = 3;
  bool questions_enabled = 4;
  bool fast_mode_available = 5;
  bool fast_mode_enabled = 6;
  string thinking_level = 7 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.session_thinking_level_nonblank"
      message: "thinking_level must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  string compaction_mode = 8 [(buf.validate.field).string = {
    in: [
      "native",
      "local",
      "none"
    ]
  }];
  int32 compaction_count = 9 [(buf.validate.field).int32.gte = 0];
  optional string previous_session_id = 10 [(buf.validate.field).string.min_len = 1];
  optional string parent_agent_session_id = 11 [(buf.validate.field).string.min_len = 1];
  optional string navigation_target_session_id = 12 [(buf.validate.field).string.min_len = 1];
  optional kent.api.runtime.WorkflowSessionStatus workflow = 13;
  option (buf.validate.message).cel = {
