syntax = "proto3";

package kent.api.session_launch;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "kent/api/auth/auth.proto";
import "kent/api/configuration/configuration.proto";
import "kent/api/chat_settings/chat_settings.proto";
import "kent/api/invocation/invocation.proto";
import "kent/api/project/project.proto";
import "kent/api/server/server.proto";
import "kent/api/shared/foundation.proto";
import "kent/api/shared/session_selector.proto";
import "kent/api/shared/validation.proto";

option go_package = "core/shared/protoapi/gen/kent/api/session_launch;sessionlaunchpb";

message SessionRuntimePreparationOptions {
  kent.api.configuration.Settings active_settings = 3 [(buf.validate.field).required = true];
  repeated kent.api.configuration.ToolID enabled_tool_ids = 4 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  optional bool questions_enabled = 5 [(buf.validate.field).required = true];
  optional bool auto_compaction_enabled = 6 [(buf.validate.field).required = true];
  bool thinking_override_explicit = 7;
  kent.api.configuration.SourceReport source = 8 [(buf.validate.field).required = true];
  optional SessionRuntimeAgentSelection agent_selection = 9;
  kent.api.configuration.ToolSelection explicit_tool_selection = 10;
}

enum SessionLaunchMode {
  SESSION_LAUNCH_MODE_UNSPECIFIED = 0;
  SESSION_LAUNCH_MODE_INTERACTIVE = 1;
  SESSION_LAUNCH_MODE_HEADLESS = 2;
}

message SessionCreateOrigin {
  oneof origin {
    option (buf.validate.oneof).required = true;

    google.protobuf.Empty independent = 1;
    string previous_session_id = 2 [
      (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
    ];
    string parent_agent_session_id = 3 [
      (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
    ];
    string navigation_only_session_id = 4 [
      (buf.validate.field).string.uuid = true,
      (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
    ];
  }
}

message SessionLaunchIntent {
  oneof intent {
    option (buf.validate.oneof).required = true;

    SessionCreateOrigin create_new = 1;
    string open_existing_session_id = 2 [
      (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
    ];
  }
}

message SessionCreateRequestOrigin {
  oneof origin {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty independent = 1;
    kent.api.shared.SessionSelector previous_session_id = 2;
    kent.api.shared.SessionSelector parent_agent_session_id = 3;
    kent.api.shared.SessionSelector navigation_only_session_id = 4;
  }
}

message SessionLaunchRequestIntent {
  oneof intent {
    option (buf.validate.oneof).required = true;
    SessionCreateRequestOrigin create_new = 1;
    kent.api.shared.SessionSelector open_existing_session_id = 2;
  }
}

message SessionPlanRequest {
  SessionLaunchMode mode = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  SessionLaunchRequestIntent intent = 2 [(buf.validate.field).required = true];
  optional string caller_session_id = 3 [(buf.validate.field).string.min_len = 1];
  kent.api.invocation.RunPromptOverrides overrides = 4;
  kent.api.chat_settings.InitialChatSettings initial_chat_settings = 5;
  optional string initial_input_draft = 6;

  option (buf.validate.message).cel = {
    id: "kent.session_launch.initial_input_draft_settings"
    message: "initial_input_draft requires initial_chat_settings"
    expression: "!has(this.initial_input_draft) || has(this.initial_chat_settings)"
  };
}

message SessionRuntimeChatSettings {
  string supervisor = 1 [(buf.validate.field).string.min_len = 1];
  string thinking = 2 [(buf.validate.field).string.min_len = 1];
  bool fast = 3;
  bool questions = 4;
  bool auto_compaction = 5;
}

message SessionRuntimeAgentSelection {
  optional string agent_role = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.session_launch.runtime_agent_selection_nonblank"
      message: "agent_role must be non-blank when present"
      expression: "this.trim() != ''"
    }
  ];
  SessionRuntimeChatSettings baseline = 2 [(buf.validate.field).required = true];
}

message SessionPlan {
  optional int64 short_id = 14 [(buf.validate.field).int64 = {gt: 0 lte: 9007199254740991}];
  string session_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  kent.api.configuration.Settings active_settings = 2 [(buf.validate.field).required = true];
  repeated kent.api.configuration.ToolID enabled_tool_ids = 3 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string configured_model_name = 4 [(buf.validate.field).string.min_len = 1];
  optional string session_name = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.session_launch.session_plan_name_nonblank"
      message: "session_name must be non-blank when present"
      expression: "this.trim() != ''"
    }
  ];
  bool model_contract_locked = 7;
  bool questions_enabled = 8;
  bool auto_compaction_enabled = 9;
  bool thinking_override_explicit = 10;
  kent.api.configuration.SourceReport source = 11 [(buf.validate.field).required = true];
  SessionRuntimeAgentSelection activation_agent_selection = 12;
  kent.api.configuration.ToolSelection explicit_tool_selection = 13;
}

message SessionPlanSuccess {
  SessionPlan plan = 1 [(buf.validate.field).required = true];
  repeated string warnings = 2;
}

enum SubagentLaunchDenialKind {
  SUBAGENT_LAUNCH_DENIAL_KIND_UNSPECIFIED = 0;
  SUBAGENT_LAUNCH_DENIAL_KIND_INVALID_TARGET = 1;
  SUBAGENT_LAUNCH_DENIAL_KIND_TARGET_MISSING = 2;
  SUBAGENT_LAUNCH_DENIAL_KIND_NOT_CALLABLE = 3;
  SUBAGENT_LAUNCH_DENIAL_KIND_CALLER_MISSING = 4;
  SUBAGENT_LAUNCH_DENIAL_KIND_PARENT_MISSING = 5;
}

message SubagentLaunchDeniedDetails {
  SubagentLaunchDenialKind kind = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  optional string target = 2 [(buf.validate.field).string.min_len = 1];
  repeated string available_roles = 3 [(buf.validate.field).repeated.items.string.min_len = 1];
}

message SessionPlanError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    SubagentLaunchDeniedDetails subagent_launch_denied = 2 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "subagent_launch_denied"
      }
    ];
    kent.api.project.WorkspaceNotRegisteredDetails workspace_not_registered = 3 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "workspace_not_registered"
      }
    ];
    SubagentLaunchMaxDepthExceededDetails max_depth_exceeded = 4 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "max_depth_exceeded"
      }
    ];
    SubagentLaunchLineageCorruptDetails lineage_corrupt = 5 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "lineage_corrupt"
      }
    ];
    kent.api.shared.InternalFailureDetails internal_failure = 6 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "internal_failure"
      }
    ];
    kent.api.auth.AuthRequiredDetails auth_required = 7 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "auth_required"
      }
    ];
    kent.api.server.ServerNotReadyDetails server_not_ready = 8 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "server_not_ready"
      }
    ];
  }
}

message SubagentLaunchMaxDepthExceededDetails {
  int32 attempted_depth = 1 [(buf.validate.field).int32.gte = 1];
  int32 max_depth = 2 [(buf.validate.field).int32.gte = 0];

  option (buf.validate.message).cel = {
    id: "kent.session_launch.subagent_depth_exceeded"
    message: "attempted_depth must exceed max_depth"
    expression: "this.attempted_depth > this.max_depth"
  };
}

message SubagentLaunchLineageCorruptDetails {
  string repeated_session_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  repeated string visited_session_ids = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.uuid = true,
    (buf.validate.field).repeated.items.string.(kent.api.shared.canonical_uuid_v4) = true
  ];
}

message SessionPlanResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;

    SessionPlanSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    SessionPlanError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

service SessionLaunchService {
  rpc Plan(SessionPlanRequest) returns (SessionPlanResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_UNARY
      authentication_stage: AUTHENTICATION_STAGE_SERVER
      scope_policy: SCOPE_POLICY_PROJECT_WORKSPACE
      direction: DIRECTION_CLIENT_TO_SERVER
      unary_connection: UNARY_CONNECTION_MULTIPLEXED
    };
  }

}
